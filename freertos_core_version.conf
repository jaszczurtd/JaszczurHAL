# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - FreeRTOS kernel version (single source of truth)
#
# STM32G474 FreeRTOS builds use this upstream FreeRTOS-Kernel checkout. RP2040
# continues to use the kernel bundled with arduino-pico's FreeRTOS mode.
#
# The pinned ref below matches the FreeRTOS-Kernel submodule commit carried by
# earlephilhower/arduino-pico 5.4.0. That core reports kernel compatibility as
# V11.1.0+; use the exact commit rather than a moving branch.
#
# Referenced by:
#   - scripts/ensure_freertos_kernel.sh
#   - runmefirst.sh
#   - stm32_lib/freertos_stm32g474.cmake
#
# To upgrade:
#   1. Update FREERTOS_KERNEL_REF and FREERTOS_KERNEL_VERSION below
#   2. Run ./scripts/ensure_freertos_kernel.sh --force
#   3. Run ./scripts/build_stm32_lib.sh --clean --freertos
#   4. Run ./runalltests.sh
#   5. Commit
# ─────────────────────────────────────────────────────────────────────────────
FREERTOS_KERNEL_REPO=https://github.com/FreeRTOS/FreeRTOS-Kernel.git
FREERTOS_KERNEL_REF=2e588af95bad29aef577373512883370c9408c1c
FREERTOS_KERNEL_VERSION=V11.1.0+
FREERTOS_KERNEL_DIR=third_party/FreeRTOS-Kernel
