# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - FreeRTOS kernel version (single source of truth)
#
# Native RP2040/RP2350 and STM32G474 FreeRTOS builds use this upstream
# FreeRTOS-Kernel checkout.
#
# The pinned ref below is the official FreeRTOS V11.3.0 release. Its RP2350
# ports are pinned through the release's Community-Supported-Ports submodule;
# use the exact commits rather than moving branches.
#
# Referenced by:
#   - scripts/ensure_freertos_kernel.sh
#   - runmefirst.sh
#   - cmake/freertos_rp.cmake
#   - stm32_lib/freertos_stm32g474.cmake
#
# To upgrade:
#   1. Update FREERTOS_KERNEL_REF and FREERTOS_KERNEL_VERSION below
#   2. Run ./third_party/update_components.sh
#   3. Build native RP and STM32 FreeRTOS matrices
#   4. Run ./runalltests.sh
#   5. Commit
# ─────────────────────────────────────────────────────────────────────────────
FREERTOS_KERNEL_REPO=https://github.com/FreeRTOS/FreeRTOS-Kernel.git
FREERTOS_KERNEL_REF=9b777ae5c5b8e9e456065a00294d1e5f5f9facf5
FREERTOS_KERNEL_VERSION=V11.3.0
FREERTOS_KERNEL_DIR=third_party/FreeRTOS-Kernel
FREERTOS_KERNEL_SUBMODULES=portable/ThirdParty/Community-Supported-Ports
