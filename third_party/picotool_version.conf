# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - picotool version (single source of truth)
#
# picotool is NOT part of the Pico SDK; it is a separate upstream repo
# (raspberrypi/picotool) that must be BUILT (it links libusb + uses the SDK).
# The native RP2040 / RP2350 flashing workflow (UF2 upload, reboot, binary-info,
# RP2350 signing) needs it.
#
# The checkout lives at third_party/picotool and the generated build lives at
# .build/tools/picotool; both are git-ignored. scripts/ensure_picotool.sh
# fetches/builds them using the pinned Pico SDK (third_party/pico-sdk), so
# ensure_pico_sdk.sh must run first.
#
# 2.3.1 is the bug-fix release made together with the pinned Pico SDK 2.3.1
# (the SDK requires picotool 2.3.0 or newer). picotool 2.3.0 rejects UF2
# conversion of an RP2350 image placed after the OTA boot image.
# JaszczurHAL imports this build as the SDK's picotool target, which skips the
# SDK's own version check; cmake/jh_rp_sdk_support.cmake compares the
# executable's reported version with PICOTOOL_VERSION instead.
# Pin the tag's exact commit, not a moving branch.
#
# Referenced by:
#   - scripts/ensure_picotool.sh
#   - runmefirst.sh
#
# To upgrade:
#   1. Update PICOTOOL_REF and PICOTOOL_VERSION below (keep in step with the SDK)
#   2. Run ./third_party/update_components.sh
#   3. Re-flash a board to validate, run ./runalltests.sh
#   4. Commit
# ─────────────────────────────────────────────────────────────────────────────
PICOTOOL_REPO=https://github.com/raspberrypi/picotool.git
PICOTOOL_REF=2041936441b48a3cc53ae3da9e805229fe8f4e18
PICOTOOL_VERSION=2.3.1
PICOTOOL_DIR=third_party/picotool
# Signing/hashing (RP2350 signed images / secure boot) comes from the Pico SDK's
# mbedtls target, so it is enabled by PICO_SDK_SUBMODULES=lib/mbedtls in
# third_party/pico_sdk_version.conf, not here - picotool itself has no build
# submodules.
