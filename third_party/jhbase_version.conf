# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - jhbase version (single source of truth)
#
# jhbase is the basics library of the C tooling plan (UTF-8, JSON, exact
# numbers, C literals, writer). JaszczurHAL depends on it already: the
# checkout's own third_party/{unity,cppcheck,pmd,riscv_toolchain,cmake_minimum}
# _version.conf are the only pins of Unity, cppcheck, PMD, the RISC-V toolchain
# and the oldest supported CMake; this
# repository keeps no copy of them and only chooses where it installs each
# tool (config/tooling/managed_components.json, jhbasePins). Every HAL build
# takes hal_status_t and COUNTOF from its jb/status.h and jb/array.h
# (cmake/jh_jhbase.cmake); the library itself is not linked into firmware yet.
#
# The checkout lives at third_party/jhbase and is git-ignored;
# scripts/ensure_jhbase.sh (component_manager.py) fetches and verifies it.
# JH_JHBASE_DIR or --dir selects an external checkout, which is verified but
# not replaced. The updater synchronizes jhbase before the pins it supplies.
#
# Referenced by:
#   - scripts/component_manager.py (jhbase_root, supplied_pin)
#   - scripts/ensure_jhbase.sh, third_party/update_components.sh
#   - .github/workflows/ci.yml cache keys of the supplied tools
#
# To upgrade:
#   1. Update JHBASE_REF (and JHBASE_VERSION when jhbase raises it) below to
#      a reviewed jhbase commit that ships the four tool pins
#   2. Run ./third_party/update_components.sh
#   3. Run ./runalltests.sh and commit; the pre-commit hook regenerates
#      security/sbom.cdx.json from this file and adds it to the commit
#      (security/third_party.json only holds {JHBASE_REF} templates)
# ─────────────────────────────────────────────────────────────────────────────
JHBASE_REPO=https://github.com/jaszczurtd/jhbase.git
JHBASE_REF=bab781e1dccf66a526caeb463247991012eb4e78
JHBASE_VERSION=0.1.0
JHBASE_DIR=third_party/jhbase
