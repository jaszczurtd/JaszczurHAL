# JaszczurHAL pinned CYW43 host-stack dependency.
#
# Unlike the fetched dependencies, this import is vendored in-tree under
# CYW43_DRIVER_DIR: the WiFi and Bluetooth firmware images are redistributed
# binaries, and the RP2040 and STM32G474 builds must compile the exact same
# bytes. Nothing is downloaded at build time. Upgrade CYW43_DRIVER_REF and
# CYW43_DRIVER_VERSION together, regenerate CYW43_DRIVER_MANIFEST, review both
# license alternatives, then run the full project gate.
CYW43_DRIVER_REPO=https://github.com/georgerobotics/cyw43-driver.git
CYW43_DRIVER_REF=dd7568229f3bf7a37737b9e1ef250c26efe75b23
CYW43_DRIVER_VERSION=dd7568229f
CYW43_DRIVER_DIR=src/hal/network/cyw43/vendor
CYW43_DRIVER_MANIFEST=src/hal/network/cyw43/vendor/SHA256SUMS
# The Bluetooth shared-bus sources come from the pinned Pico SDK instead of the
# driver upstream, and carry the local safety delta described in
# src/hal/network/cyw43/UPSTREAM.md. Keep the REF equal to PICO_SDK_REF; the
# imported shared-bus sources did not change between Pico SDK 2.2.0 and 2.3.1.
CYW43_SHARED_BUS_REPO=https://github.com/raspberrypi/pico-sdk.git
CYW43_SHARED_BUS_REF=079c6f39023649b154152db30f1d781e884879bc
CYW43_SHARED_BUS_VERSION=2.3.1
