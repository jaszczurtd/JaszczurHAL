# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - cppcheck version (single source of truth)
#
# The cppcheck gate in runalltests.sh and CI, and consumers' MISRA scans, run
# this build instead of the distribution package: findings and the MISRA addon
# differ between cppcheck releases (2.10 reports rule 5.7 on every anonymous
# enum), so one pinned build keeps every host on the same result.
#
# The checkout lives at third_party/cppcheck and the build at
# .build/tools/cppcheck; both are git-ignored. scripts/ensure_cppcheck.sh
# fetches and builds them; scripts/cppcheck.sh runs the result.
# Pin the tag's exact commit, not a moving branch.
#
# Referenced by:
#   - scripts/ensure_cppcheck.sh, scripts/cppcheck.sh
#   - third_party/update_components.sh (runmefirst.sh)
#
# To upgrade:
#   1. Update CPPCHECK_REF and CPPCHECK_VERSION below
#   2. Run ./third_party/update_components.sh
#   3. Run ./runalltests.sh and the consumers' cppcheck/MISRA gates; refresh
#      their baselines in the same change
#   4. Commit
# ─────────────────────────────────────────────────────────────────────────────
CPPCHECK_REPO=https://github.com/danmar/cppcheck.git
CPPCHECK_REF=da29903ffcbde465b6c2b47e8dc38277743f47ec
CPPCHECK_VERSION=2.13.0
CPPCHECK_DIR=third_party/cppcheck
