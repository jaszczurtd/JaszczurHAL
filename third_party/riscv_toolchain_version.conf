# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - RISC-V (rp2350-riscv) toolchain version (single source of truth)
#
# The rp2350-riscv target (RP2350 Hazard3 core) needs a bare-metal RISC-V GCC
# with the triple the Pico SDK auto-detects (riscv32-unknown-elf; see
# pico-sdk cmake/preload/toolchains/pico_riscv_gcc.cmake). The ARM targets
# (rp2040, rp2350-arm) use arm-none-eabi and do NOT need this.
#
# Source is the official upstream Raspberry Pi prebuilt (raspberrypi/pico-sdk-
# tools releases). Co-versioned with the pinned
# Pico SDK 2.2.0. The checkout lives at third_party/riscv-toolchain, is
# git-ignored, and is fetched/verified by scripts/ensure_riscv_toolchain.sh.
#
# The native build points the SDK at it:
#   export PICO_TOOLCHAIN_PATH=third_party/riscv-toolchain
#
# Referenced by:
#   - scripts/ensure_riscv_toolchain.sh
#   - runmefirst.sh
#
# To upgrade:
#   1. Update RISCV_TOOLCHAIN_TAG / _ASSET_STEM / _GCC_MAJOR below
#   2. Run ./third_party/update_components.sh
#   3. Build the rp2350-riscv target, run ./runalltests.sh
#   4. Commit
# ─────────────────────────────────────────────────────────────────────────────
RISCV_TOOLCHAIN_RELEASE_BASE=https://github.com/raspberrypi/pico-sdk-tools/releases/download
RISCV_TOOLCHAIN_TAG=v2.2.0-4
# Full asset name is ${STEM}-${arch}.${format}. Linux uses tar.gz and native
# Windows uses the x64-win ZIP published by the same pinned release.
RISCV_TOOLCHAIN_ASSET_STEM=riscv-toolchain-15
RISCV_TOOLCHAIN_GCC_MAJOR=15
RISCV_TOOLCHAIN_TRIPLE=riscv32-unknown-elf
RISCV_TOOLCHAIN_DIR=third_party/riscv-toolchain
RISCV_TOOLCHAIN_SHA256_X86_64_LIN=813baded4ac345e169d8d1c7e242e38f28ebf95a8b9b386539fa023835d55589
RISCV_TOOLCHAIN_SHA256_AARCH64_LIN=2128e1b44a6259ce8c241255784a026a25c58ab64b9b2d2e567fb473e00c705f
RISCV_TOOLCHAIN_SHA256_X64_WIN=acfe0edfa1d57e0abca42a23524ac74b9b9d7c6887d9bf305ad2fa96937def2f
