# JaszczurHAL - ESP-IDF version (single source of truth)
#
# Native ESP32-family builds use this exact official ESP-IDF release. The
# checkout is fetched on demand because ESP-IDF and its recursive submodules
# are substantially larger than the dependencies required by existing targets.
#
# Synchronize it with:
#   ./scripts/ensure_esp_idf.sh --enable
#
# An external checkout can be selected with JH_ESP_IDF_DIR or --dir. It must
# match the exact commit below and contain matching recursive submodules.
#
# To upgrade:
#   1. Update ESP_IDF_REF and ESP_IDF_VERSION below.
#   2. Run ./scripts/ensure_esp_idf.sh --enable.
#   3. Refresh security/esp_idf_tools.json as security_supply_chain.md
#      describes, then run python3 scripts/sync_generated.py --write: the gate
#      rejects a stale security/sbom.cdx.json.
#   4. Rebuild every supported ESP target and run the full quality gate.
ESP_IDF_REPO=https://github.com/espressif/esp-idf.git
ESP_IDF_REF=7101770dc6db2667b3c477cc31365dd1acd6db4e
ESP_IDF_VERSION=6.0.2
ESP_IDF_DIR=third_party/esp-idf
ESP_IDF_TARGETS=esp32,esp32s3
