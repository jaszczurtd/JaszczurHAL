# cve-bin-tool release used by the security stage, locally and in CI.
# scripts/install_host_tools.sh (runmefirst.sh, every Linux CI job) installs
# this wheel with pipx after checking its SHA-256; pip resolves its
# dependencies at install time. Its --check and scripts/check_vulnerabilities.sh
# refuse any other version. Update version, URL and SHA-256 (from PyPI)
# together.
