# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - Arduino RP2040 core version (single source of truth)
#
# This file pins the exact version of the earlephilhower/arduino-pico core
# that JaszczurHAL is validated against. All scripts and CI workflows source
# this value so there is ONE place to update when upgrading.
#
# Referenced by:
#   - runmefirst.sh           (local toolchain install)
#   - scripts/build_arduino_lib.sh (informational; uses whatever is installed)
#   - .github/workflows/ci.yml (CI installs this version)
#
# To upgrade:
#   1. Change RP2040_CORE_VERSION below
#   2. Run ./runmefirst.sh to install the new version locally
#   3. Run ./scripts/build_arduino_lib.sh --clean -D HAL_PROVIDE_APP_ENTRY
#   4. Fix any API breaks, run ./runalltests.sh
#   5. Commit
# ─────────────────────────────────────────────────────────────────────────────
RP2040_CORE_VERSION=5.4.0
