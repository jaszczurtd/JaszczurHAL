<?xml version="1.0"?>
<def format="2">
  <!-- Keep cppcheck's value flow aligned with the GNU backend selected by
       hal_compiler.h. The analyzer does not model __atomic_load_n itself. -->
  <define name="__ATOMIC_RELAXED" value="0"/>
  <define name="__ATOMIC_ACQUIRE" value="2"/>
  <define name="__ATOMIC_RELEASE" value="3"/>
  <define name="__ATOMIC_ACQ_REL" value="4"/>
  <define name="__ATOMIC_SEQ_CST" value="5"/>
  <define name="__atomic_load_n(object,order)" value="(*(object))"/>
  <define name="__atomic_compare_exchange_n(object,expected,desired,weak,success_order,failure_order)" value="(*(object) == *(expected))"/>
</def>
