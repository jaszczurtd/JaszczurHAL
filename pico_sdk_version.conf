# ─────────────────────────────────────────────────────────────────────────────
# JaszczurHAL - Raspberry Pi Pico SDK version (single source of truth)
#
# The native RP2040 / RP2350 backend builds directly against the official
# upstream Pico SDK (raspberrypi/pico-sdk), NOT the copy bundled with
# earlephilhower/arduino-pico. This decouples JaszczurHAL from the arduino-pico
# carrier (see context_JaszczurHAL/native-rp2040.md, step 6 of arduino-dep.md).
#
# The checkout lives at third_party/pico-sdk, is git-ignored, and is fetched or
# verified by scripts/ensure_pico_sdk.sh - exactly like the FreeRTOS-Kernel
# checkout pinned in freertos_core_version.conf.
#
# 2.2.0 is the latest official tag and the first line that supports both RP2040
# and RP2350 (arm + risc-v). Pin the tag's exact commit, not a moving branch.
#
# PICO_SDK_SUBMODULES lists the SDK's own submodules the native build needs
# (space-separated, relative to the SDK root). tinyusb backs the native hal_usb
# takeover (step 5); mbedtls provides the target picotool uses for RP2350
# hashing/signing. lwIP and cyw43-driver are intentionally excluded because
# JaszczurHAL vendors its own. Fetched on demand by --with-submodules.
#
# Referenced by:
#   - scripts/ensure_pico_sdk.sh
#   - runmefirst.sh
#   - rp2040_native_lib/ (native target build; consumes PICO_SDK_PATH)
#
# To upgrade:
#   1. Update PICO_SDK_REF and PICO_SDK_VERSION below
#   2. Run ./scripts/ensure_pico_sdk.sh --force
#   3. Rebuild the native RP2040 target, run ./runalltests.sh
#   4. Commit
# ─────────────────────────────────────────────────────────────────────────────
PICO_SDK_REPO=https://github.com/raspberrypi/pico-sdk.git
PICO_SDK_REF=a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
PICO_SDK_VERSION=2.2.0
PICO_SDK_DIR=third_party/pico-sdk
PICO_SDK_SUBMODULES="lib/tinyusb lib/mbedtls"
