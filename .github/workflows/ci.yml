name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security refresh: Monday 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

jobs:
  windows-tooling:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - name: Cache authenticated Windows tools
        uses: actions/cache@v4
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Verify idempotent component and tool state
        shell: powershell
        run: >-
          .\runmefirst.ps1 -VerifyOnly -Force -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Test Python runtime, platform, launchers and generators
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $tests = @(
            'tests/test_vscode_platform_adapter.py',
            'tests/test_vscode_native_workflow.py',
            'tests/test_vscode_native_upload.py',
            'tests/test_vscode_serial_persistent.py',
            'tests/test_vscode_windows_serial.py',
            'tests/test_vscode_windows_bootsel.py',
            'tests/test_ota_firewall_config.py',
            'tests/test_serial_io.py',
            'tests/test_rp_ota_artifacts.py',
            'tests/test_vscode_windows_tooling.py',
            'tests/test_vscode_build_environment.py',
            'tests/test_component_manager.py',
            'tests/test_board_generator.py',
            'tests/test_feature_registry.py'
          )
          foreach ($test in $tests) {
            & $python $test .
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Verify FreeRTOS CMake dependency integration
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot

          $cmake = $state.tools.cmake
          $repo = $env:GITHUB_WORKSPACE
          $source = Join-Path $repo 'cmake\jh_firmware_project'
          $project = Join-Path $repo 'examples\18_freertos_suite'
          $buildRoot = Join-Path $state.buildRoot 'ci-freertos-configure'
          $featureDefines = 'HAL_ENABLE_FREERTOS;HAL_ENABLE_APP_TASK1'

          function Invoke-FreeRtosConfigure {
            param(
              [string]$TargetName,
              [string]$BoardName,
              [string]$BuildDirectory,
              [string]$ExpectedPort,
              [string[]]$ExtraArguments
            )

            $configureArguments = @(
              '-S', $source,
              '-B', $BuildDirectory,
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)",
              "-DPython3_EXECUTABLE=$($state.python)",
              "-DJH_PROJECT_DIR=$project",
              '-DJH_MODULE_NAME=18_freertos_suite',
              '-DJH_PROJECT_SOURCES=app.c',
              "-DJH_TARGET=$TargetName",
              "-DJH_BOARD=$BoardName",
              "-DJH_EXTRA_DEFINES=$featureDefines",
              "-DJH_ARTIFACT_DIR=$BuildDirectory\artifacts",
              '-DCMAKE_BUILD_TYPE=Release',
              '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
            )
            $configureArguments += $ExtraArguments

            $configureOutput = & $cmake @configureArguments 2>&1
            $configureExitCode = $LASTEXITCODE
            $configureText = $configureOutput | Out-String
            Write-Host $configureText
            if ($configureExitCode -ne 0) {
              throw "$TargetName FreeRTOS configure failed."
            }
            foreach ($needle in @('FreeRTOS-Kernel', 'synchronized')) {
              if ($configureText -notmatch [regex]::Escape($needle)) {
                throw "$TargetName configure did not report '$needle'."
              }
            }

            $databasePath = Join-Path $BuildDirectory 'compile_commands.json'
            if (-not (Test-Path -LiteralPath $databasePath -PathType Leaf)) {
              throw "$TargetName compile database is missing: $databasePath"
            }
            $sourceFiles = (Get-Content $databasePath -Raw |
              ConvertFrom-Json) | ForEach-Object {
                $_.file -replace '\\', '/'
              }
            $sourceText = $sourceFiles -join "`n"
            foreach ($expectedSource in @(
              'third_party/FreeRTOS-Kernel/tasks.c',
              $ExpectedPort
            )) {
              if ($sourceText -notmatch [regex]::Escape($expectedSource)) {
                throw "$TargetName compile database omitted $expectedSource."
              }
            }
          }

          Invoke-FreeRtosConfigure `
            -TargetName 'rp2040' `
            -BoardName 'pico' `
            -BuildDirectory (Join-Path $buildRoot 'rp2040') `
            -ExpectedPort 'portable/ThirdParty/GCC/RP2040/port.c' `
            -ExtraArguments @(
              "-DPICO_SDK_PATH=$(Join-Path $repo 'third_party\pico-sdk')",
              "-DJH_PICOTOOL_EXECUTABLE=$($state.tools.picotool)"
            )

          Invoke-FreeRtosConfigure `
            -TargetName 'stm32g474' `
            -BoardName 'nucleo-g474re' `
            -BuildDirectory (Join-Path $buildRoot 'stm32g474') `
            -ExpectedPort 'portable/GCC/ARM_CM4F/port.c' `
            -ExtraArguments @(
              "-DCMAKE_TOOLCHAIN_FILE=$(Join-Path $repo 'stm32_lib\toolchain_stm32g474.cmake')"
            )

      - name: Validate MSVC warning profile and Windows test classification
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          & $state.tools.cmake "-DJH_ROOT=$env:GITHUB_WORKSPACE" `
            -P tests/test_host_warning_profiles.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Warning-profile test failed.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is missing: $vswhere"
          }
          $vsInstall = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) {
            throw 'A Visual Studio installation with the MSVC x64 tools is missing.'
          }
          $devShell = Join-Path $vsInstall `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vsInstall `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (-not (Get-Command cl.exe -CommandType Application `
                    -ErrorAction SilentlyContinue)) {
            throw 'MSVC cl.exe is unavailable after Enter-VsDevShell.'
          }

          $build = 'C:\jh\build\host-msvc'
          & $state.tools.cmake -S . -B $build `
            -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)" `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DJH_ENABLE_FREERTOS_POSIX_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host configure failed.' }

          $commands = Get-Content `
            (Join-Path $build 'compile_commands.json') -Raw |
            ConvertFrom-Json
          $probe = $commands |
            Where-Object { $_.file -like '*test_host_compiler_smoke.cpp' } |
            Select-Object -First 1
          if (-not $probe) { throw 'MSVC warning probe command is missing.' }
          $probeText = if ($probe.command) {
            $probe.command
          } else {
            $probe.arguments -join ' '
          }
          foreach ($flag in @('/W4', '/permissive-', '/WX')) {
            if ($probeText -notmatch [regex]::Escape($flag)) {
              throw "MSVC warning probe omitted $flag."
            }
          }

          & $state.tools.cmake --build $build --parallel 2 `
            --target test_host_compiler_smoke `
              test_hal_config_headers_c test_hal_config_headers_cpp `
              test_bsd_socket_headers_c
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed to compile.' }

          $ctest = Join-Path (Split-Path -Parent $state.tools.cmake) 'ctest.exe'
          & $ctest --test-dir $build --output-on-failure `
            -R '^(test_host_compiler_smoke|test_hal_config_headers_c|test_hal_config_headers_cpp|test_bsd_socket_headers_c)$'
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed.' }
          $inventory = (& $ctest --test-dir $build --show-only=json-v1 |
            Out-String) | ConvertFrom-Json
          $disabled = @(
            'test_bsd_sockets',
            'test_bsd_sockets_c_compile',
            'test_bsd_without_tls_compile',
            'test_bearssl_native_integration',
            'test_freertos_posix_runtime'
          )
          foreach ($name in $disabled) {
            $test = $inventory.tests | Where-Object name -eq $name
            $property = $test.properties |
              Where-Object { $_.name -eq 'DISABLED' -and $_.value -eq $true }
            if (-not $test -or -not $property) {
              throw "$name is not visible as a disabled Windows test."
            }
          }

  windows-firmware:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rp2040
            board: pico
            uf2: true
          - target: rp2350-arm
            board: pico2
            uf2: true
          - target: rp2350-riscv
            board: pico2
            uf2: true
          - target: stm32g474
            board: nucleo-g474re
            uf2: false
    name: "Windows firmware (${{ matrix.target }})"

    steps:
      - uses: actions/checkout@v5

      - name: Cache authenticated Windows tools
        uses: actions/cache@v4
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Generate consumer project in a path with spaces
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          & $python vscode/tools/create-vscode-example.py `
            --output $project `
            --name 'Stage 5 Windows Consumer' `
            --target '${{ matrix.target }}' `
            --board '${{ matrix.board }}'
          if ($LASTEXITCODE -ne 0) { throw 'Consumer project generation failed.' }

      - name: Build static library and representative firmware with Ninja
        shell: powershell
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          $entry = Join-Path $env:GITHUB_WORKSPACE 'vscode\entry\jh-vscode.cmd'
          & $entry build --project $project `
            --target '${{ matrix.target }}' --board '${{ matrix.board }}'
          if ($LASTEXITCODE -ne 0) { throw 'Representative firmware build failed.' }
          & $entry refresh-intellisense --project $project `
            --target '${{ matrix.target }}' --board '${{ matrix.board }}'
          if ($LASTEXITCODE -ne 0) { throw 'Compile database refresh failed.' }

          $artifactRoot = Join-Path $project '.build'
          $expected = @('firmware.elf', 'firmware.bin', 'firmware.hex', 'firmware.map')
          if ('${{ matrix.uf2 }}' -eq 'true') { $expected += 'firmware.uf2' }
          $expected += 'compile_commands_patched.json'
          foreach ($name in $expected) {
            $path = Join-Path $artifactRoot $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing managed artifact: $path"
            }
          }

          $archives = Get-ChildItem -LiteralPath C:\jh\build -Recurse `
            -File -Filter 'libJaszczurHAL.a'
          if ('${{ matrix.target }}' -ne 'stm32g474' -and -not $archives) {
            throw 'Native RP build did not produce libJaszczurHAL.a.'
          }

      - name: Build STM32G474 static library
        if: matrix.target == 'stm32g474'
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw | ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot
          $build = 'C:\jh\build\static-stm32g474'
          & $state.tools.cmake -S stm32_lib -B $build -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\stm32_lib\toolchain_stm32g474.cmake" `
            "-DPython3_EXECUTABLE=$($state.python)" `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          if ($LASTEXITCODE -ne 0) { throw 'STM32 static-library configure failed.' }
          & $state.tools.cmake --build $build --target JaszczurHAL
          if ($LASTEXITCODE -ne 0) { throw 'STM32 static-library build failed.' }
          if (-not (Test-Path "$build\libJaszczurHAL.a" -PathType Leaf)) {
            throw 'STM32 static-library archive is missing.'
          }

      - name: Upload representative firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-firmware
          path: stage5 consumer with spaces/.build/*
          if-no-files-found: error
          include-hidden-files: true

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify generated feature registry
        run: python3 scripts/generate_hal_features.py --check

      - name: Validate effective feature configuration
        run: |
          python3 scripts/generate_hal_features.py \
            --lint --effective --input-root . \
            --resolution-output .build/ci/effective-feature-resolution.json

      - name: Upload effective feature resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-feature-resolution
          path: .build/ci/effective-feature-resolution.json
          if-no-files-found: error

      - name: Install GNU Arm Embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      - name: Prepare host source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force

      - name: Configure
        run: cmake -B .build/ci/host

      - name: Build
        run: cmake --build .build/ci/host --parallel

      - name: Test
        run: ctest --test-dir .build/ci/host --output-on-failure

  # ── Valgrind memcheck gate ─────────────────────────────────────────────────
  # Runs the host unit-test suite under Valgrind to catch memory defects
  # (leaks, use-after-free, invalid/uninitialised reads). Host-only: this does
  # NOT exercise firmware on MCU targets - it validates the portable HAL logic
  # tested in tests/. Memcheck flags and the suppressions file are configured in
  # the root CMakeLists.txt (MEMORYCHECK_* -> DartConfiguration.tcl), so a real
  # defect exits non-zero and fails this job.
  memcheck:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Prepare host source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: cmake -B .build/ci/memcheck

      - name: Build
        run: cmake --build .build/ci/memcheck --parallel

      - name: Run tests under Valgrind
        run: ctest --test-dir .build/ci/memcheck -T memcheck --output-on-failure

  # ── Static analysis gate ───────────────────────────────────────────────────
  # Two complementary analyzers on the project's OWN code (vendored libraries
  # excluded). They reach layers the host valgrind gate cannot run:
  #
  #   cppcheck    - parses standalone, so it scans ALL own code: portable logic,
  #                 the mock/RP/STM32 backends.
  #   clang-tidy  - needs a compile database, so it covers the host-compilable
  #                 production code: portable HAL (src/hal/hal_*.cpp), shared/,
  #                 and the stm32g474 backend. The mock backend (test scaffolding)
  #                 is intentionally out of scope.
  #
  # Tool configs live in .clang-tidy and tests/cppcheck-suppressions.txt. Pinned
  # to the analyzers shipped on ubuntu-latest (clang-tidy 18, cppcheck 2.13) so
  # CI and local runs agree. Vendored code excluded: bundled drivers/frameworks,
  # cJSON, TJpgDec, LodePNG, lwIP, Unity.
  static-analysis:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Prepare analysis source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force

      - name: Install analyzers
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck clang-tools

      - name: Generate compile databases
        run: |
          cmake -B .build/ci/static-host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S stm32_lib -B .build/ci/static-stm32 \
            -DJH_STM32_HOST_SANITY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: "cppcheck (all own code; vendored excluded)"
        run: |
          cppcheck --enable=warning,performance,portability \
            --inline-suppr \
            --suppressions-list=tests/cppcheck-suppressions.txt \
            -i src/hal/impl/rp2040/drivers \
            -i src/hal/impl/rp2040/frameworks \
            -i src/hal/impl/shared/frameworks/cjson \
            -i src/hal/impl/shared/frameworks/jpeg \
            -i src/hal/impl/shared/frameworks/lodepng \
            -i src/utils/unity.c \
            --error-exitcode=1 --quiet \
            src

      - name: "clang-tidy (portable HAL + shared + stm32 backend)"
        run: |
          mkdir -p .build/ci/static-analysis
          TIDY_HOST_BUILD=.build/ci/static-host/clang_tidy_db
          mapfile -t TIDY_HOST_FILES < <(
            scripts/clang_tidy_files.py --build-dir .build/ci/static-host --repo-root "$PWD" --profile host \
              --output-compile-db "$TIDY_HOST_BUILD/compile_commands.json"
          )
          test "${#TIDY_HOST_FILES[@]}" -gt 0
          run-clang-tidy -p "$TIDY_HOST_BUILD" -quiet "${TIDY_HOST_FILES[@]}" \
            | tee .build/ci/static-analysis/tidy_host.log
          TIDY_STM32_BUILD=.build/ci/static-stm32/clang_tidy_db
          mapfile -t TIDY_STM32_FILES < <(
            scripts/clang_tidy_files.py --build-dir .build/ci/static-stm32 --repo-root "$PWD" --profile stm32 \
              --output-compile-db "$TIDY_STM32_BUILD/compile_commands.json"
          )
          test "${#TIDY_STM32_FILES[@]}" -gt 0
          run-clang-tidy -p "$TIDY_STM32_BUILD" -quiet "${TIDY_STM32_FILES[@]}" \
            | tee .build/ci/static-analysis/tidy_stm32.log
          if grep -qE ' (warning|error):' \
            .build/ci/static-analysis/tidy_host.log \
            .build/ci/static-analysis/tidy_stm32.log; then
            echo "::error::clang-tidy reported findings (see logs above)"
            exit 1
          fi

  # ── Security supply-chain gate ─────────────────────────────────────────────
  # Regenerates the repository CycloneDX SBOM from security/third_party.json and
  # verifies that the committed SBOM is up to date. Then runs osv-scanner against
  # the source tree and cve-bin-tool against the generated SBOM. cve-bin-tool
  # intentionally does not scan the managed .build artifact tree because object
  # files create excessive noise; the SBOM is the source of truth for tracked
  # bundled and pinned dependencies.
  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install security scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates python3 pipx

          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) osv_arch="amd64" ;;
            aarch64|arm64) osv_arch="arm64" ;;
            *) echo "::error::Unsupported osv-scanner architecture: ${arch}"; exit 1 ;;
          esac

          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_${osv_arch}" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

          python3 -m pipx install cve-bin-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify generated SBOM is current
        run: ./scripts/check_sbom.sh

      - name: Run vulnerability scan
        run: JH_SECURITY_SCAN_SOURCE=1 ./scripts/check_vulnerabilities.sh

  # ── STM32 skeleton compile gate ────────────────────────────────────────────
  # This job builds the STM32G474 static-library target with the host compiler
  # It catches backend regressions in src/hal/impl/stm32g474
  # and contributes directly to CI quality scoring.
  stm32-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Prepare STM32 source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force

      - name: Configure STM32 host build
        run: cmake -S stm32_lib -B .build/ci/stm32-host -DJH_STM32_HOST_SANITY=ON

      - name: Build STM32 host static library
        run: cmake --build .build/ci/stm32-host --parallel

  # ── Official Pico SDK native build gate ───────────────────────────────────
  # Builds the HAL source inventory for RP2040,
  # RP2350 ARM and RP2350 Hazard3 RISC-V. Each build must produce the library,
  # native entry/core probes, portable core-runtime firmware and the pinned
  # FreeRTOS SMP integration.
  native-pico-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install native Pico build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libusb-1.0-0-dev pkg-config

      - name: Prepare pinned Pico SDK tools
        run: ./third_party/update_components.sh

      - name: Build RP2040, RP2350 ARM and RP2350 RISC-V artifacts
        run: |
          for platform in rp2040 rp2350-arm-s rp2350-riscv; do
            ./scripts/build_rp_native_lib.sh \
              --platform "${platform}" --example 01_core_runtime \
              --clean --jobs 4
            ./scripts/build_rp_native_lib.sh \
              --platform "${platform}" --example 18_freertos_suite \
              --example-source app.c \
              --freertos --clean --jobs 4 \
              --output ".build/ci/native/${platform}/freertos"
          done

      - name: Build consolidated RP2040 example gate
        run: scripts/examples_dispatcher.py build --target rp2040 --gate --jobs 4

      - name: Verify native RP link inputs
        run: |
          if find .build/native .build/ci/native .build/examples \
              -type f -name core.a -print -quit | grep -q .; then
            echo "::error::Native RP build produced an unexpected core.a"
            exit 1
          fi
          if grep -R -E '(^|[ /])core\.a([[:space:]]|$)|arduino-pico|Arduino\.h' \
              .build/native .build/ci/native .build/examples \
              --include='link.txt' --include='*.map' \
              --include='compile_commands.json' --include='CMakeCache.txt'; then
            echo "::error::Native RP build metadata references the removed carrier"
            exit 1
          fi

      - name: Build native parity hardware fixtures
        run: scripts/build_rp_native_parity_fixtures.sh --jobs 4

      - name: Build RP2040 CYW43 Bluetooth ownership fixture
        run: |
          for variant in bluetooth wifi-only; do
            vscode/entry/jh-vscode build \
              --project tests/hardware/bluetooth_stage1 \
              --target rp2040 --board picow --variant "${variant}"
          done

      - name: Build native OTA hardware fixture matrix
        run: |
          for selection in \
            "rp2040 picow" \
            "rp2040 pico-rm2" \
            "rp2350-arm pico2w"; do
            set -- ${selection}
            vscode/entry/jh-vscode build \
              --project tests/hardware/rp_ota \
              --target "$1" --board "$2"
            vscode/entry/jh-vscode build \
              --project tests/hardware/rp_ota \
              --target "$1" --board "$2" --variant freertos
          done

  # ── Flag-propagation regression matrix ─────────────────────────────────────
  # JaszczurHAL uses an opt-in HAL_ENABLE_* model with automatic upstream
  # dependency propagation (e.g. HAL_ENABLE_PCF8563 implies HAL_ENABLE_RTC
  # and HAL_ENABLE_I2C). The matrix profiles below exercise the
  # extreme corners of the flag space so any regression in
  # src/hal/hal_config.h (broken propagation, missing #ifdef guard in a
  # backend TU, stale consistency #error) shows up as a failed native RP
  # static-library build.
  #
  #   empty-core   - no HAL_ENABLE_* flags at all. Validates that the
  #                  bare-core library still compiles when every optional
  #                  module is off (catches missing #ifdef guards).
  #   no-radio-network - public WiFi/TCP/UDP surface on a plain Pico profile.
  #                  Validates runtime rejection without touching CYW43 pins.
  #   typical-set  - a realistic subset chosen so that *every*
  #                  propagation chain in hal_config.h fires at least
  #                  once (KV->EEPROM, MQTT->WIFI, PCF8563->RTC+I2C,
  #                  GPS->SWSERIAL, MCP9600->THERMOCOUPLE+I2C,
  #                  DS18B20->ONEWIRE, ILI9341->TFT->DISPLAY).
  #   udp-wireguard - UDP without TCP plus WireGuard/lwIP. Catches network
  #                  helpers accidentally hidden behind HAL_ENABLE_TCP and
  #                  warning regressions in bundled lwIP include ordering.
  #   picow-owned  - Pico W profile with JaszczurHAL-owned CYW43/lwIP.
  #   pim730-owned - Pico+PIM730 profile with the external radio frontend and
  #                  JaszczurHAL-owned CYW43/lwIP.
  #   all-enabled  - every concrete HAL_ENABLE_* module/backend flag set
  #                  explicitly. Validates that no two backends collide
  #                  and that all consistency #error checks stay satisfied.
  native-flag-matrix:
    runs-on: ubuntu-latest
    needs: [test, stm32-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: empty-core
            board: pico
            platform: rp2040
            flags: -D HAL_BOARD_PROFILE_RP_PICO
          - profile: rp2350-arm-empty
            board: pico2
            platform: rp2350-arm-s
            flags: -D HAL_BOARD_PROFILE_RP_PICO_2
          - profile: no-radio-network
            board: pico
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_TCP
              -D HAL_ENABLE_UDP
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: typical-set
            board: picow
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_MQTT
              -D HAL_ENABLE_KV
              -D HAL_ENABLE_PCF8563
              -D HAL_ENABLE_MCP9600
              -D HAL_ENABLE_DS18B20
              -D HAL_ENABLE_GPS
              -D HAL_ENABLE_ILI9341
              -D HAL_DISPLAY_ILI9341
              -D HAL_ENABLE_PWM_FREQ
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_W
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: udp-wireguard
            board: picow
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_WIREGUARD
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_W
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: picow-owned
            board: picow
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_TCP
              -D HAL_ENABLE_BSD_SOCKETS
              -D HAL_ENABLE_TLS
              -D HAL_ENABLE_HTTP_CLIENT
              -D HAL_ENABLE_HTTP_SERVER
              -D HAL_ENABLE_HTTP_FILES
              -D HAL_ENABLE_WEBSOCKET
              -D HAL_ENABLE_NET_CONSOLE
              -D HAL_ENABLE_MQTT
              -D HAL_ENABLE_WIREGUARD
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_W
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: pico2w-owned
            board: pico2w
            platform: rp2350-arm-s
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_TCP
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_2_W
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: pim730-owned
            board: pico-rm2
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_TCP
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_PIM730
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u
          - profile: all-enabled
            board: picow
            platform: rp2040
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_TIME
              -D HAL_ENABLE_MQTT
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_TCP
              -D HAL_ENABLE_BSD_SOCKETS
              -D HAL_ENABLE_TLS
              -D HAL_ENABLE_HTTP_CLIENT
              -D HAL_ENABLE_HTTP_SERVER
              -D HAL_ENABLE_HTTP_FILES
              -D HAL_ENABLE_WEBSOCKET
              -D HAL_ENABLE_NET_CONSOLE
              -D HAL_ENABLE_NET_COMMANDS
              -D HAL_ENABLE_OTA
              -D HAL_ENABLE_WIREGUARD
              -D HAL_ENABLE_EEPROM
              -D HAL_ENABLE_KV
              -D HAL_ENABLE_LITTLEFS
              -D HAL_ENABLE_FAT
              -D HAL_ENABLE_SDLOGGER
              -D HAL_ENABLE_UART
              -D HAL_ENABLE_SWSERIAL
              -D HAL_ENABLE_I2C
              -D HAL_ENABLE_I2C_SLAVE
              -D HAL_ENABLE_MCP2515
              -D HAL_ENABLE_PCF8563
              -D HAL_ENABLE_DS3231
              -D HAL_ENABLE_MCP9600
              -D HAL_ENABLE_MAX6675
              -D HAL_ENABLE_DS18B20
              -D HAL_ENABLE_ONEWIRE
              -D HAL_ENABLE_EXTERNAL_ADC
              -D HAL_ENABLE_GPS
              -D HAL_ENABLE_DAC
              -D HAL_ENABLE_PCNT
              -D HAL_ENABLE_PWM_FREQ
              -D HAL_ENABLE_RGB_LED
              -D HAL_ENABLE_ILI9341
              -D HAL_DISPLAY_ILI9341
              -D HAL_ENABLE_SSD1306
              -D HAL_ENABLE_CRYPTO
              -D HAL_ENABLE_CJSON
              -D HAL_NETWORK_BACKEND_CYW43
              -D HAL_CYW43_BUS_PICO_PIO
              -D HAL_CYW43_STACK_LWIP
              -D HAL_BOARD_PROFILE_RP_PICO_W
              -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u

    name: "Native RP lib (${{ matrix.profile }})"
    steps:
      - uses: actions/checkout@v5

      - name: Prepare RP source dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libusb-1.0-0-dev pkg-config
          ./third_party/update_components.sh

      - name: "Quality Gate: Build native RP static library (${{ matrix.profile }})"
        run: |
          ./scripts/build_rp_native_lib.sh --clean \
            --platform ${{ matrix.platform }} \
            --board ${{ matrix.board }} \
            --output ".build/ci/flags/${{ matrix.profile }}" \
            ${{ matrix.flags }}
          test -f ".build/ci/flags/${{ matrix.profile }}/libJaszczurHAL.a"
          if find ".build/ci/flags/${{ matrix.profile }}" \
              -type f -name core.a -print -quit | grep -q .; then
            echo "::error::Native RP flag build produced an unexpected core.a"
            exit 1
          fi
          if grep -R -E '(^|[ /])core\.a([[:space:]]|$)|arduino-pico|Arduino\.h' \
              ".build/ci/flags/${{ matrix.profile }}" \
              --include='link.txt' --include='*.map' \
              --include='compile_commands.json' --include='CMakeCache.txt'; then
            echo "::error::Native RP flag build references the removed carrier"
            exit 1
          fi

  # ── Examples build gate ────────────────────────────────────────────────────
  # Compile the representative example gate through dispatcher-backed VS Code
  # manifests. Gate 6 covers the two RP2350 ISAs; the manifests retain the full
  # supported-target matrix for explicit builds.
  stm32-examples:
    runs-on: ubuntu-latest
    needs: test
    name: "Examples (STM32G474)"

    steps:
      - uses: actions/checkout@v5

      - name: Prepare example source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force
          ./scripts/ensure_btstack.sh --force

      - name: Install STM32 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Compile STM32G474 CYW43 static library
        run: |
          scripts/build_stm32_lib.sh \
            --output .build/ci/stm32-cyw43 \
            --board nucleo-g474re-pim730 \
            -D HAL_ENABLE_WIFI \
            -D HAL_ENABLE_TCP \
            -D HAL_ENABLE_UDP \
            -D HAL_NETWORK_BACKEND_CYW43 \
            -D HAL_CYW43_BUS_STM32_GSPI \
            -D HAL_CYW43_STACK_LWIP \
            -D HAL_CYW43_PIN_WL_ON=30u \
            -D HAL_CYW43_PIN_CHIP_SELECT=28u \
            -D HAL_CYW43_PIN_DATA=31u \
            -D HAL_CYW43_PIN_CLOCK=29u \
            -D HAL_CYW43_MAX_TRANSACTION_BYTES=2048u \
            --jobs 4

      - name: Build STM32G474 CYW43 Bluetooth ownership fixture
        run: |
          for variant in bluetooth wifi-only; do
            vscode/entry/jh-vscode build \
              --project tests/hardware/bluetooth_stage1 \
              --target stm32g474 --board nucleo-g474re-pim730 \
              --variant "${variant}"
          done

      - name: Compile STM32G474 examples
        run: scripts/examples_dispatcher.py build --target stm32g474 --gate --jobs 4
