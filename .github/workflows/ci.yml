name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security refresh: Monday 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

jobs:
  windows-tooling:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - name: Cache pinned ESP-IDF SDK and tools
        uses: actions/cache@v4
        with:
          path: |
            third_party/esp-idf
            ~/.espressif
          key: esp-idf-${{ runner.os }}-${{ hashFiles('third_party/esp_idf_version.conf') }}

      - name: Cache authenticated Windows tools
        uses: actions/cache@v4
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Verify idempotent component and tool state
        shell: powershell
        run: >-
          .\runmefirst.ps1 -VerifyOnly -Force -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Test Python runtime, platform, launchers and generators
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $tests = @(
            'tests/test_vscode_platform_adapter.py',
            'tests/test_vscode_native_workflow.py',
            'tests/test_vscode_native_upload.py',
            'tests/test_vscode_serial_persistent.py',
            'tests/test_vscode_windows_serial.py',
            'tests/test_vscode_windows_bootsel.py',
            'tests/test_ota_firewall_config.py',
            'tests/test_serial_io.py',
            'tests/test_rp_ota_artifacts.py',
            'tests/test_vscode_windows_tooling.py',
            'tests/test_vscode_build_environment.py',
            'tests/test_component_manager.py',
            'tests/test_esp_idf_phase0.py',
            'tests/test_esp32s3_phase1.py',
            'tests/test_esp32s3_phase2.py',
            'tests/test_esp32s3_phase3.py',
            'tests/test_esp_ci_contract.py',
            'tests/test_board_generator.py',
            'tests/test_feature_registry.py'
          )
          foreach ($test in $tests) {
            & $python $test .
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Build ESP32-S3 Phase 3 fixture with pinned ESP-IDF
        id: esp32_phase3_build
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $output = Join-Path $env:GITHUB_WORKSPACE `
            '.build\ci\esp-idf\esp32s3-phase3'
          & $python scripts/build_esp_idf.py build `
            --project tests/fixtures/esp32s3_phase3 `
            --target esp32s3 `
            --board waveshare-esp32-s3-zero `
            --output $output `
            --clean
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $failureDiagnostic = Join-Path $output 'jh_esp_idf_failure.txt'
            $buildLog = Join-Path $output 'build.log'
            if (Test-Path -LiteralPath $buildLog) {
              Write-Host 'Last 300 lines of the ESP-IDF build log:'
              Get-Content -LiteralPath $buildLog -Tail 300
            }
            Write-Host 'ESP-IDF failure diagnostic:'
            if (Test-Path -LiteralPath $failureDiagnostic) {
              Get-Content -LiteralPath $failureDiagnostic
            } else {
              Write-Warning "Missing failure diagnostic: $failureDiagnostic"
            }
            exit $buildExitCode
          }

      - name: Upload ESP32-S3 Phase 3 build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-esp32s3-phase3
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_artifacts.json
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/bootloader/bootloader.bin
            .build/ci/esp-idf/esp32s3-phase3/partition_table/partition-table.bin
            .build/ci/esp-idf/esp32s3-phase3/ota_data_initial.bin
            .build/ci/esp-idf/esp32s3-phase3/esp32s3_phase3.bin
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload ESP32-S3 Phase 3 failure diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
          steps.esp32_phase3_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-esp32s3-phase3-failure
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_failure.txt
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/generated/jaszczurhal/
            .build/ci/esp-idf/esp32s3-phase3/CMakeCache.txt
            .build/ci/esp-idf/esp32s3-phase3/CMakeFiles/CMakeConfigureLog.yaml
            .build/ci/esp-idf/esp32s3-phase3/project_description.json
            .build/ci/esp-idf/esp32s3-phase3/compile_commands.json
            .build/ci/esp-idf/esp32s3-phase3/flasher_args.json
            .build/ci/esp-idf/esp32s3-phase3/sdkconfig
          if-no-files-found: warn
          include-hidden-files: true

      - name: Verify FreeRTOS CMake dependency integration
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot

          $cmake = $state.tools.cmake
          $repo = $env:GITHUB_WORKSPACE
          $source = Join-Path $repo 'cmake\jh_firmware_project'
          $project = Join-Path $repo 'examples\18_freertos_suite'
          $buildRoot = Join-Path $state.buildRoot 'ci-freertos-configure'
          $featureDefines = 'HAL_ENABLE_FREERTOS;HAL_ENABLE_APP_TASK1'

          function Invoke-FreeRtosConfigure {
            param(
              [string]$TargetName,
              [string]$BoardName,
              [string]$BuildDirectory,
              [string]$ExpectedPort,
              [string[]]$ExtraArguments
            )

            $configureArguments = @(
              '-S', $source,
              '-B', $BuildDirectory,
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)",
              "-DPython3_EXECUTABLE=$($state.python)",
              "-DJH_PROJECT_DIR=$project",
              '-DJH_MODULE_NAME=18_freertos_suite',
              '-DJH_PROJECT_SOURCES=app.c',
              "-DJH_TARGET=$TargetName",
              "-DJH_BOARD=$BoardName",
              "-DJH_EXTRA_DEFINES=$featureDefines",
              "-DJH_ARTIFACT_DIR=$BuildDirectory\artifacts",
              '-DCMAKE_BUILD_TYPE=Release',
              '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
            )
            $configureArguments += $ExtraArguments

            $previousErrorActionPreference = $ErrorActionPreference
            try {
              # CMake writes informational Pico SDK messages to stderr.
              $ErrorActionPreference = 'Continue'
              $configureOutput = & $cmake @configureArguments 2>&1
              $configureExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            $configureText = $configureOutput | Out-String
            Write-Host $configureText
            if ($configureExitCode -ne 0) {
              throw "$TargetName FreeRTOS configure failed."
            }
            foreach ($needle in @('FreeRTOS-Kernel', 'synchronized')) {
              if ($configureText -notmatch [regex]::Escape($needle)) {
                throw "$TargetName configure did not report '$needle'."
              }
            }

            $databasePath = Join-Path $BuildDirectory 'compile_commands.json'
            if (-not (Test-Path -LiteralPath $databasePath -PathType Leaf)) {
              throw "$TargetName compile database is missing: $databasePath"
            }
            $sourceFiles = (Get-Content $databasePath -Raw |
              ConvertFrom-Json) | ForEach-Object {
                $_.file -replace '\\', '/'
              }
            $sourceText = $sourceFiles -join "`n"
            foreach ($expectedSource in @(
              'third_party/FreeRTOS-Kernel/tasks.c',
              $ExpectedPort
            )) {
              if ($sourceText -notmatch [regex]::Escape($expectedSource)) {
                throw "$TargetName compile database omitted $expectedSource."
              }
            }
          }

          Invoke-FreeRtosConfigure `
            -TargetName 'rp2040' `
            -BoardName 'pico' `
            -BuildDirectory (Join-Path $buildRoot 'rp2040') `
            -ExpectedPort 'portable/ThirdParty/GCC/RP2040/port.c' `
            -ExtraArguments @(
              "-DPICO_SDK_PATH=$(Join-Path $repo 'third_party\pico-sdk')",
              "-DJH_PICOTOOL_EXECUTABLE=$($state.tools.picotool)"
            )

          Invoke-FreeRtosConfigure `
            -TargetName 'stm32g474' `
            -BoardName 'nucleo-g474re' `
            -BuildDirectory (Join-Path $buildRoot 'stm32g474') `
            -ExpectedPort 'portable/GCC/ARM_CM4F/port.c' `
            -ExtraArguments @(
              "-DCMAKE_TOOLCHAIN_FILE=$(Join-Path $repo 'stm32_lib\toolchain_stm32g474.cmake')"
            )

      - name: Validate MSVC warning profile and Windows test classification
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          & $state.tools.cmake "-DJH_ROOT=$env:GITHUB_WORKSPACE" `
            -P tests/test_host_warning_profiles.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Warning-profile test failed.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is missing: $vswhere"
          }
          $vsInstall = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) {
            throw 'A Visual Studio installation with the MSVC x64 tools is missing.'
          }
          $devShell = Join-Path $vsInstall `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vsInstall `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (-not (Get-Command cl.exe -CommandType Application `
                    -ErrorAction SilentlyContinue)) {
            throw 'MSVC cl.exe is unavailable after Enter-VsDevShell.'
          }

          $build = 'C:\jh\build\host-msvc'
          & $state.tools.cmake -S . -B $build `
            -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)" `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DJH_ENABLE_FREERTOS_POSIX_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host configure failed.' }

          $commands = Get-Content `
            (Join-Path $build 'compile_commands.json') -Raw |
            ConvertFrom-Json
          $probe = $commands |
            Where-Object { $_.file -like '*test_host_compiler_smoke.cpp' } |
            Select-Object -First 1
          if (-not $probe) { throw 'MSVC warning probe command is missing.' }
          $probeText = if ($probe.command) {
            $probe.command
          } else {
            $probe.arguments -join ' '
          }
          foreach ($flag in @('/W4', '/permissive-', '/WX')) {
            if ($probeText -notmatch [regex]::Escape($flag)) {
              throw "MSVC warning probe omitted $flag."
            }
          }

          & $state.tools.cmake --build $build --parallel 2 `
            --target test_host_compiler_smoke `
              test_hal_config_headers_c test_hal_config_headers_cpp `
              test_bsd_socket_headers_c
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed to compile.' }

          $ctest = Join-Path (Split-Path -Parent $state.tools.cmake) 'ctest.exe'
          & $ctest --test-dir $build --output-on-failure `
            -R '^(test_host_compiler_smoke|test_hal_config_headers_c|test_hal_config_headers_cpp|test_bsd_socket_headers_c)$'
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed.' }
          $inventory = (& $ctest --test-dir $build --show-only=json-v1 |
            Out-String) | ConvertFrom-Json
          $disabled = @(
            'test_bsd_sockets',
            'test_bsd_sockets_c_compile',
            'test_bsd_without_tls_compile',
            'test_bearssl_native_integration',
            'test_freertos_posix_runtime'
          )
          foreach ($name in $disabled) {
            $test = $inventory.tests | Where-Object name -eq $name
            $property = $test.properties |
              Where-Object { $_.name -eq 'DISABLED' -and $_.value -eq $true }
            if (-not $test -or -not $property) {
              throw "$name is not visible as a disabled Windows test."
            }
          }

  windows-static-library:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rp2040
            board: picow
          - target: rp2350-arm
            board: pico2w
          - target: rp2350-riscv
            board: pico2
          - target: stm32g474
            board: nucleo-g474re-pim730
    name: "Windows all-features library (${{ matrix.target }})"

    steps:
      - uses: actions/checkout@v5

      - name: Cache authenticated Windows tools
        uses: actions/cache@v4
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Generate consumer project in a path with spaces
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          & $python vscode/tools/create-vscode-example.py `
            --output $project `
            --name 'Stage 5 Windows Consumer' `
            --target '${{ matrix.target }}' `
            --board '${{ matrix.board }}'
          if ($LASTEXITCODE -ne 0) { throw 'Consumer project generation failed.' }

      - name: Build linkable static library with Ninja
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot

          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          $build = Join-Path $state.buildRoot 'ci-static-${{ matrix.target }}'
          if ('${{ matrix.target }}' -eq 'stm32g474') {
            $source = Join-Path $env:GITHUB_WORKSPACE 'stm32_lib'
          } else {
            $source = Join-Path $env:GITHUB_WORKSPACE 'rp_native_lib'
          }
          $arguments = @(
            '-S', $source,
            '-B', $build,
            '-G', 'Ninja',
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)",
            "-DPython3_EXECUTABLE=$($state.python)",
            "-DHAL_PROJECT_CONFIG_DIR=$project",
            '-DJH_TARGET=${{ matrix.target }}',
            '-DJH_BOARD=${{ matrix.board }}',
            '-DJH_ENABLE_ALL_FEATURES=ON',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
          )
          if ('${{ matrix.target }}' -eq 'stm32g474') {
            $arguments += "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\stm32_lib\toolchain_stm32g474.cmake"
          } else {
            $arguments += "-DPICO_SDK_PATH=$env:GITHUB_WORKSPACE\third_party\pico-sdk"
            $arguments += "-DJH_PICOTOOL_EXECUTABLE=$($state.tools.picotool)"
            $arguments += '-DJH_RP_NATIVE_BUILD_ARTIFACT_PROBE=OFF'
            $arguments += '-DJH_RP_NATIVE_BUILD_CORE1_PROBE=OFF'
          }
          if ('${{ matrix.target }}' -eq 'rp2350-riscv') {
            $arguments += "-DPICO_TOOLCHAIN_PATH=$(Split-Path -Parent (Split-Path -Parent $state.tools.riscv))"
          }

          & $state.tools.cmake @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Static-library configure failed.' }
          & $state.tools.cmake --build $build --target JaszczurHAL
          if ($LASTEXITCODE -ne 0) { throw 'Static-library build failed.' }
          if (-not (Test-Path "$build\libJaszczurHAL.a" -PathType Leaf)) {
            throw 'Static-library archive is missing.'
          }

      - name: Upload linkable static library
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.target }}-static-library
          path: C:\jh\build\ci-static-${{ matrix.target }}\libJaszczurHAL.a
          if-no-files-found: error
          include-hidden-files: true

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache pinned ESP-IDF SDK and tools
        uses: actions/cache@v4
        with:
          path: |
            third_party/esp-idf
            ~/.espressif
          key: esp-idf-${{ runner.os }}-${{ hashFiles('third_party/esp_idf_version.conf') }}

      - name: Verify release metadata and tag ancestry
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 scripts/check_release_metadata.py \
              --tag "${GITHUB_REF_NAME}" --release-ref origin/main
          else
            python3 scripts/check_release_metadata.py
          fi

      - name: Verify generated feature registry
        run: python3 scripts/generate_hal_features.py --check

      - name: Verify generated board registry and fallback
        run: >-
          python3 scripts/generate_board_config.py
          --boards-root boards --check-static

      - name: Validate effective feature configuration
        run: |
          python3 scripts/generate_hal_features.py \
            --lint --effective --input-root . \
            --resolution-output .build/ci/effective-feature-resolution.json

      - name: Upload effective feature resolution
        if: ${{ always() && hashFiles('.build/ci/effective-feature-resolution.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: effective-feature-resolution
          path: .build/ci/effective-feature-resolution.json
          if-no-files-found: error

      - name: Install GNU Arm Embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev

      - name: Prepare host source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force
          ./scripts/ensure_btstack.sh --force
          ./scripts/ensure_sx126x.sh --force
          ./scripts/ensure_freertos_kernel.sh --force

      - name: Configure
        run: >-
          cmake -B .build/ci/host
          -DJH_ENABLE_FREERTOS_POSIX_TESTS=ON

      - name: Build
        run: cmake --build .build/ci/host --parallel

      - name: Test
        run: ctest --test-dir .build/ci/host --output-on-failure

      - name: Build ESP32-S3 Phase 3 fixture with pinned ESP-IDF
        id: esp32_phase3_build
        run: |
          output="${GITHUB_WORKSPACE}/.build/ci/esp-idf/esp32s3-phase3"
          build_exit=0
          python3 scripts/build_esp_idf.py build \
            --project tests/fixtures/esp32s3_phase3 \
            --target esp32s3 \
            --board waveshare-esp32-s3-zero \
            --output "${output}" \
            --clean || build_exit=$?
          if (( build_exit != 0 )); then
            if [[ -f "${output}/build.log" ]]; then
              echo 'Last 300 lines of the ESP-IDF build log:'
              tail -n 300 "${output}/build.log"
            fi
            echo 'ESP-IDF failure diagnostic:'
            if [[ -f "${output}/jh_esp_idf_failure.txt" ]]; then
              sed -n '1,120p' "${output}/jh_esp_idf_failure.txt"
            else
              echo "Missing failure diagnostic: ${output}/jh_esp_idf_failure.txt" >&2
            fi
            exit "${build_exit}"
          fi

      - name: Upload ESP32-S3 Phase 3 build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32s3-phase3
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_artifacts.json
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/bootloader/bootloader.bin
            .build/ci/esp-idf/esp32s3-phase3/partition_table/partition-table.bin
            .build/ci/esp-idf/esp32s3-phase3/ota_data_initial.bin
            .build/ci/esp-idf/esp32s3-phase3/esp32s3_phase3.bin
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload ESP32-S3 Phase 3 failure diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
          steps.esp32_phase3_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32s3-phase3-failure
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_failure.txt
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/generated/jaszczurhal/
            .build/ci/esp-idf/esp32s3-phase3/CMakeCache.txt
            .build/ci/esp-idf/esp32s3-phase3/CMakeFiles/CMakeConfigureLog.yaml
            .build/ci/esp-idf/esp32s3-phase3/project_description.json
            .build/ci/esp-idf/esp32s3-phase3/compile_commands.json
            .build/ci/esp-idf/esp32s3-phase3/flasher_args.json
            .build/ci/esp-idf/esp32s3-phase3/sdkconfig
          if-no-files-found: warn
          include-hidden-files: true

  # ── Sanitizer and parser fuzz gate ─────────────────────────────────────────
  sanitizer-fuzz:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install Clang and GNU Arm Embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev

      - name: Prepare host source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force
          ./scripts/ensure_btstack.sh --force
          ./scripts/ensure_sx126x.sh --force
          ./scripts/ensure_freertos_kernel.sh --force

      - name: Configure ASan, UBSan and libFuzzer
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -B .build/ci/sanitizer-fuzz
          -DJH_ENABLE_SANITIZERS=ON
          -DJH_ENABLE_FUZZING=ON

      - name: Build instrumented tests and fuzzers
        run: cmake --build .build/ci/sanitizer-fuzz --parallel

      - name: Run instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir .build/ci/sanitizer-fuzz --output-on-failure

      - name: Smoke fuzz network parsers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          for target in fuzz_http_server fuzz_websocket fuzz_http_multipart; do
            ".build/ci/sanitizer-fuzz/tests/${target}" \
              -runs=2000 -max_len=1024
          done

  # ── Valgrind memcheck gate ─────────────────────────────────────────────────
  # Runs the host unit-test suite under Valgrind to catch memory defects
  # (leaks, use-after-free, invalid/uninitialised reads). Host-only: this does
  # NOT exercise firmware on MCU targets - it validates the portable HAL logic
  # tested in tests/. Memcheck flags and the suppressions file are configured in
  # the root CMakeLists.txt (MEMORYCHECK_* -> DartConfiguration.tcl), so a real
  # defect exits non-zero and fails this job.
  memcheck:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Prepare host source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force
          ./scripts/ensure_btstack.sh --force
          ./scripts/ensure_sx126x.sh --force
          ./scripts/ensure_freertos_kernel.sh --force

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valgrind \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-dev

      - name: Configure
        run: cmake -B .build/ci/memcheck

      - name: Build
        run: cmake --build .build/ci/memcheck --parallel

      - name: Run tests under Valgrind
        run: ctest --test-dir .build/ci/memcheck -T memcheck --output-on-failure

  # ── Static analysis gate ───────────────────────────────────────────────────
  # Three complementary analyzers on the project's OWN code (vendored libraries
  # excluded). They reach layers the host valgrind gate cannot run:
  #
  #   cppcheck    - parses standalone, so it scans ALL own code: portable logic,
  #                 the mock/RP/STM32 backends.
  #   clang-tidy  - needs a compile database, so it covers the host-compilable
  #                 production code in the thematic src/hal directories and the
  #                 stm32g474 backend. The mock backend (test scaffolding) is
  #                 intentionally out of scope.
  #   PMD CPD     - compares C/C++ implementation tokens across the mock,
  #                 thematic portable HAL, RP and STM32G474 code without
  #                 requiring compilation.
  #
  # Tool configs live in .clang-tidy, tests/cppcheck-suppressions.txt and
  # scripts/run_cpd.py. PMD is an authenticated 7.26.0 archive managed under
  # third_party; the other analyzers come from ubuntu-latest. Vendored code is
  # excluded from duplicate analysis and static-analysis ownership.
  static-analysis:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Prepare analysis source dependencies
        run: |
          ./scripts/ensure_bearssl.sh --force
          ./scripts/ensure_cjson.sh --force
          ./scripts/ensure_lodepng.sh --force
          ./scripts/ensure_jpeg.sh --force
          ./scripts/ensure_fatfs.sh --force
          ./scripts/ensure_unity.sh --force
          ./scripts/ensure_lwip.sh --force
          ./scripts/ensure_littlefs.sh --force
          ./scripts/ensure_sx126x.sh --force

      - name: Install analyzers
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang-tidy cppcheck clang-tools default-jre-headless

      - name: Prepare pinned PMD CPD
        run: ./scripts/ensure_pmd.sh --force

      - name: Generate compile databases
        run: |
          cmake -B .build/ci/static-host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S stm32_lib -B .build/ci/static-stm32 \
            -DJH_STM32_HOST_SANITY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: "cppcheck (all own code; vendored excluded)"
        run: |
          cppcheck --enable=warning,performance,portability \
            --inline-suppr \
            --suppressions-list=tests/cppcheck-suppressions.txt \
            -i src/hal/impl/rp2040/drivers \
            -i src/hal/codecs/cjson \
            -i src/hal/codecs/jpeg \
            -i src/hal/codecs/lodepng \
            -i src/utils/unity.c \
            --error-exitcode=1 --quiet \
            src

      - name: "clang-tidy (portable HAL + shared + stm32 backend)"
        run: |
          mkdir -p .build/ci/static-analysis
          TIDY_HOST_BUILD=.build/ci/static-host/clang_tidy_db
          mapfile -t TIDY_HOST_FILES < <(
            scripts/clang_tidy_files.py --build-dir .build/ci/static-host --repo-root "$PWD" --profile host \
              --output-compile-db "$TIDY_HOST_BUILD/compile_commands.json"
          )
          test "${#TIDY_HOST_FILES[@]}" -gt 0
          run-clang-tidy -p "$TIDY_HOST_BUILD" -quiet "${TIDY_HOST_FILES[@]}" \
            | tee .build/ci/static-analysis/tidy_host.log
          TIDY_STM32_BUILD=.build/ci/static-stm32/clang_tidy_db
          mapfile -t TIDY_STM32_FILES < <(
            scripts/clang_tidy_files.py --build-dir .build/ci/static-stm32 --repo-root "$PWD" --profile stm32 \
              --output-compile-db "$TIDY_STM32_BUILD/compile_commands.json"
          )
          test "${#TIDY_STM32_FILES[@]}" -gt 0
          run-clang-tidy -p "$TIDY_STM32_BUILD" -quiet "${TIDY_STM32_FILES[@]}" \
            | tee .build/ci/static-analysis/tidy_stm32.log
          if grep -qE ' (warning|error):' \
            .build/ci/static-analysis/tidy_host.log \
            .build/ci/static-analysis/tidy_stm32.log; then
            echo "::error::clang-tidy reported findings (see logs above)"
            exit 1
          fi

      - name: "PMD CPD strict duplicate gate (owned C/C++ implementations)"
        run: >-
          scripts/run_cpd.py
          --output-dir .build/ci/static-analysis/cpd

  # ── Security supply-chain gate ─────────────────────────────────────────────
  # Regenerates the repository CycloneDX SBOM from security/third_party.json and
  # verifies that the committed SBOM is up to date. Then runs osv-scanner against
  # the source tree and cve-bin-tool against the generated SBOM. cve-bin-tool
  # intentionally does not scan the managed .build artifact tree because object
  # files create excessive noise; the SBOM is the source of truth for tracked
  # bundled and pinned dependencies.
  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install security scanners
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates python3 pipx

          arch="$(uname -m)"
          case "${arch}" in
            x86_64|amd64) osv_arch="amd64" ;;
            aarch64|arm64) osv_arch="arm64" ;;
            *) echo "::error::Unsupported osv-scanner architecture: ${arch}"; exit 1 ;;
          esac

          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_${osv_arch}" \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

          python3 -m pipx install cve-bin-tool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify generated SBOM is current
        run: ./scripts/check_sbom.sh

      - name: Run vulnerability scan
        run: JH_SECURITY_SCAN_SOURCE=1 ./scripts/check_vulnerabilities.sh

  # ── One all-features build per production architecture ─────────────────────
  linux-static-library:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rp2040
            platform: rp2040
            board: picow
          - target: rp2350-arm
            platform: rp2350-arm-s
            board: pico2w
          - target: rp2350-riscv
            platform: rp2350-riscv
            board: pico2
          - target: stm32g474
            platform: stm32g474
            board: nucleo-g474re-pim730
    name: "Linux all-features library (${{ matrix.target }})"

    steps:
      - uses: actions/checkout@v5

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libusb-1.0-0-dev pkg-config default-jre-headless

      - name: Prepare pinned source dependencies
        run: ./third_party/update_components.sh

      - name: Build all-features static library
        run: |
          if [[ "${{ matrix.target }}" == "stm32g474" ]]; then
            ./scripts/build_stm32_lib.sh \
              --all-features --clean --jobs 4 \
              --board "${{ matrix.board }}" \
              --output ".build/ci/linux/${{ matrix.target }}"
          else
            ./scripts/build_rp_native_lib.sh \
              --all-features --library-only --clean --jobs 4 \
              --platform "${{ matrix.platform }}" \
              --board "${{ matrix.board }}" \
              --output ".build/ci/linux/${{ matrix.target }}"
          fi

          build_dir=".build/ci/linux/${{ matrix.target }}"
          test -f "${build_dir}/libJaszczurHAL.a"
          if find "${build_dir}" -type f -name core.a -print -quit |
              grep -q .; then
            echo "::error::Native build produced an unexpected core.a"
            exit 1
          fi
          if grep -R -E '(^|[ /])core\.a([[:space:]]|$)|arduino-pico|Arduino\.h' \
              "${build_dir}" \
              --include='link.txt' --include='*.map' \
              --include='compile_commands.json' --include='CMakeCache.txt'; then
            echo "::error::Native build metadata references the removed carrier"
            exit 1
          fi
