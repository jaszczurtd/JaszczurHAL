name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security refresh: Monday 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

# Windows jobs check what the Linux gate host cannot run; the Linux jobs
# below run stages of runalltests.sh.
jobs:
  windows-tooling:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Cache pinned ESP-IDF SDK and tools
        uses: actions/cache@v5
        with:
          path: |
            third_party/esp-idf
            ~/.espressif
          key: esp-idf-${{ runner.os }}-${{ hashFiles('third_party/esp_idf_version.conf', 'security/esp_idf_tools.json') }}

      - name: Cache authenticated Windows tools
        uses: actions/cache@v5
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Verify idempotent component and tool state
        shell: powershell
        run: >-
          .\runmefirst.ps1 -VerifyOnly -Force -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Test Python runtime, platform, launchers and generators
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $tests = @(
            'tests/test_vscode_platform_adapter.py',
            'tests/test_vscode_native_workflow.py',
            'tests/test_vscode_library_workspace.py',
            'tests/test_vscode_native_upload.py',
            'tests/test_vscode_serial_persistent.py',
            'tests/test_vscode_windows_serial.py',
            'tests/test_vscode_windows_bootsel.py',
            'tests/test_ota_firewall_config.py',
            'tests/test_serial_io.py',
            'tests/test_rp_ota_artifacts.py',
            'tests/test_vscode_windows_tooling.py',
            'tests/test_vscode_build_environment.py',
            'tests/test_component_manager.py',
            'tests/test_esp_idf_phase0.py',
            'tests/test_esp32s3_phase2.py',
            'tests/test_esp32s3_phase3.py',
            'tests/test_esp_ci_contract.py',
            'tests/test_board_generator.py',
            'tests/test_tooling_contract.py',
            'tests/test_feature_registry.py'
          )
          foreach ($test in $tests) {
            & $python $test .
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Build ESP32-S3 Phase 3 fixture with pinned ESP-IDF
        id: esp32_phase3_build
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $output = Join-Path $env:GITHUB_WORKSPACE `
            '.build\ci\esp-idf\esp32s3-phase3'
          & $python scripts/build_esp_idf.py build `
            --project tests/fixtures/esp32s3_phase3 `
            --target esp32s3 `
            --board waveshare-esp32-s3-zero `
            --output $output `
            --clean
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $failureDiagnostic = Join-Path $output 'jh_esp_idf_failure.txt'
            $buildLog = Join-Path $output 'build.log'
            if (Test-Path -LiteralPath $buildLog) {
              Write-Host 'Last 300 lines of the ESP-IDF build log:'
              Get-Content -LiteralPath $buildLog -Tail 300
            }
            Write-Host 'ESP-IDF failure diagnostic:'
            if (Test-Path -LiteralPath $failureDiagnostic) {
              Get-Content -LiteralPath $failureDiagnostic
            } else {
              Write-Warning "Missing failure diagnostic: $failureDiagnostic"
            }
            exit $buildExitCode
          }

      - name: Upload ESP32-S3 Phase 3 build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-esp32s3-phase3
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_artifacts.json
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/bootloader/bootloader.bin
            .build/ci/esp-idf/esp32s3-phase3/partition_table/partition-table.bin
            .build/ci/esp-idf/esp32s3-phase3/ota_data_initial.bin
            .build/ci/esp-idf/esp32s3-phase3/esp32s3_phase3.bin
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload ESP32-S3 Phase 3 failure diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
          steps.esp32_phase3_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-esp32s3-phase3-failure
          path: |
            .build/ci/esp-idf/esp32s3-phase3/jh_esp_idf_failure.txt
            .build/ci/esp-idf/esp32s3-phase3/build.log
            .build/ci/esp-idf/esp32s3-phase3/generated/jaszczurhal/
            .build/ci/esp-idf/esp32s3-phase3/CMakeCache.txt
            .build/ci/esp-idf/esp32s3-phase3/CMakeFiles/CMakeConfigureLog.yaml
            .build/ci/esp-idf/esp32s3-phase3/project_description.json
            .build/ci/esp-idf/esp32s3-phase3/compile_commands.json
            .build/ci/esp-idf/esp32s3-phase3/flasher_args.json
            .build/ci/esp-idf/esp32s3-phase3/sdkconfig
          if-no-files-found: warn
          include-hidden-files: true

      - name: Verify FreeRTOS CMake dependency integration
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot

          $cmake = $state.tools.cmake
          $repo = $env:GITHUB_WORKSPACE
          $source = Join-Path $repo 'cmake\jh_firmware_project'
          $project = Join-Path $repo 'examples\18_freertos_suite'
          $buildRoot = Join-Path $state.buildRoot 'ci-freertos-configure'

          function Invoke-FreeRtosConfigure {
            param(
              [string]$TargetName,
              [string]$BoardName,
              [string]$BuildDirectory,
              [string]$ExpectedPort,
              [string[]]$ExtraArguments
            )

            $configureArguments = @(
              '-S', $source,
              '-B', $BuildDirectory,
              '-G', 'Ninja',
              "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)",
              "-DPython3_EXECUTABLE=$($state.python)",
              "-DJH_PROJECT_DIR=$project",
              '-DJH_MODULE_NAME=18_freertos_suite',
              "-DJH_TARGET=$TargetName",
              "-DJH_BOARD=$BoardName",
              "-DJH_ARTIFACT_DIR=$BuildDirectory\artifacts",
              '-DCMAKE_BUILD_TYPE=Release',
              '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
            )
            $configureArguments += $ExtraArguments

            $previousErrorActionPreference = $ErrorActionPreference
            try {
              # CMake writes informational Pico SDK messages to stderr.
              $ErrorActionPreference = 'Continue'
              $configureOutput = & $cmake @configureArguments 2>&1
              $configureExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            $configureText = $configureOutput | Out-String
            Write-Host $configureText
            if ($configureExitCode -ne 0) {
              throw "$TargetName FreeRTOS configure failed."
            }
            foreach ($needle in @('FreeRTOS-Kernel', 'synchronized')) {
              if ($configureText -notmatch [regex]::Escape($needle)) {
                throw "$TargetName configure did not report '$needle'."
              }
            }

            $databasePath = Join-Path $BuildDirectory 'compile_commands.json'
            if (-not (Test-Path -LiteralPath $databasePath -PathType Leaf)) {
              throw "$TargetName compile database is missing: $databasePath"
            }
            $sourceFiles = (Get-Content $databasePath -Raw |
              ConvertFrom-Json) | ForEach-Object {
                $_.file -replace '\\', '/'
              }
            $sourceText = $sourceFiles -join "`n"
            foreach ($expectedSource in @(
              'third_party/FreeRTOS-Kernel/tasks.c',
              $ExpectedPort
            )) {
              if ($sourceText -notmatch [regex]::Escape($expectedSource)) {
                throw "$TargetName compile database omitted $expectedSource."
              }
            }
          }

          Invoke-FreeRtosConfigure `
            -TargetName 'rp2040' `
            -BoardName 'pico' `
            -BuildDirectory (Join-Path $buildRoot 'rp2040') `
            -ExpectedPort 'portable/ThirdParty/GCC/RP2040/port.c' `
            -ExtraArguments @(
              "-DPICO_SDK_PATH=$(Join-Path $repo 'third_party\pico-sdk')",
              "-DJH_PICOTOOL_EXECUTABLE=$($state.tools.picotool)"
            )

          Invoke-FreeRtosConfigure `
            -TargetName 'stm32g474' `
            -BoardName 'nucleo-g474re' `
            -BuildDirectory (Join-Path $buildRoot 'stm32g474') `
            -ExpectedPort 'portable/GCC/ARM_CM4F/port.c' `
            -ExtraArguments @(
              "-DCMAKE_TOOLCHAIN_FILE=$(Join-Path $repo 'link_libraries\stm32_lib\toolchain_stm32g474.cmake')"
            )

      - name: Validate MSVC warning profile and Windows test classification
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          & $state.tools.cmake "-DJH_ROOT=$env:GITHUB_WORKSPACE" `
            -P tests/test_host_warning_profiles.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Warning-profile test failed.' }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is missing: $vswhere"
          }
          $vsInstall = (& $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) {
            throw 'A Visual Studio installation with the MSVC x64 tools is missing.'
          }
          $devShell = Join-Path $vsInstall `
            'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vsInstall `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          if (-not (Get-Command cl.exe -CommandType Application `
                    -ErrorAction SilentlyContinue)) {
            throw 'MSVC cl.exe is unavailable after Enter-VsDevShell.'
          }

          $build = 'C:\jh\build\host-msvc'
          & $state.tools.cmake -S . -B $build `
            -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)" `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DJH_ENABLE_FREERTOS_POSIX_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host configure failed.' }

          $commands = Get-Content `
            (Join-Path $build 'compile_commands.json') -Raw |
            ConvertFrom-Json
          $probe = $commands |
            Where-Object { $_.file -like '*test_host_compiler_smoke.cpp' } |
            Select-Object -First 1
          if (-not $probe) { throw 'MSVC warning probe command is missing.' }
          $probeText = if ($probe.command) {
            $probe.command
          } else {
            $probe.arguments -join ' '
          }
          foreach ($flag in @('/W4', '/permissive-', '/WX')) {
            if ($probeText -notmatch [regex]::Escape($flag)) {
              throw "MSVC warning probe omitted $flag."
            }
          }

          & $state.tools.cmake --build $build --parallel 2 `
            --target test_host_compiler_smoke test_cpu_only_bss `
              test_hal_config_headers_c test_hal_config_headers_cpp `
              test_bsd_socket_headers_c
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed to compile.' }

          $ctest = Join-Path (Split-Path -Parent $state.tools.cmake) 'ctest.exe'
          & $ctest --test-dir $build --output-on-failure `
            -R '^(test_host_compiler_smoke|test_cpu_only_bss|test_hal_config_headers_c|test_hal_config_headers_cpp|test_bsd_socket_headers_c)$'
          if ($LASTEXITCODE -ne 0) { throw 'MSVC host API tests failed.' }
          $inventory = (& $ctest --test-dir $build --show-only=json-v1 |
            Out-String) | ConvertFrom-Json
          $disabled = @(
            'test_bsd_sockets',
            'test_bsd_sockets_c_compile',
            'test_bsd_without_tls_compile',
            'test_bearssl_native_integration',
            'test_freertos_posix_runtime'
          )
          foreach ($name in $disabled) {
            $test = $inventory.tests | Where-Object name -eq $name
            $property = $test.properties |
              Where-Object { $_.name -eq 'DISABLED' -and $_.value -eq $true }
            if (-not $test -or -not $property) {
              throw "$name is not visible as a disabled Windows test."
            }
          }

  windows-static-library:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rp2040
            board: picow
          - target: rp2350-arm
            board: pico2w
          - target: rp2350-riscv
            board: pico2
          - target: stm32g474
            board: nucleo-g474re-pim730
    name: "Windows all-features library (${{ matrix.target }})"

    steps:
      - uses: actions/checkout@v6

      - name: Cache authenticated Windows tools
        uses: actions/cache@v5
        with:
          path: C:\jh\tools
          key: windows-tools-${{ hashFiles('third_party/windows_tools_version.conf', 'third_party/riscv_toolchain_version.conf', 'third_party/windows_requirements.txt') }}

      - name: Prepare native Windows environment
        shell: powershell
        run: >-
          .\runmefirst.ps1 -Force -ConfigureHost -FirmwareOnly
          -ToolsRoot C:\jh\tools
          -BuildRoot C:\jh\build

      - name: Generate consumer project in a path with spaces
        shell: powershell
        run: |
          $python = '.\.build\windows\venv\Scripts\python.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          & $python vscode/tools/create-vscode-example.py `
            --output $project `
            --name 'Stage 5 Windows Consumer' `
            --target '${{ matrix.target }}' `
            --board '${{ matrix.board }}'
          if ($LASTEXITCODE -ne 0) { throw 'Consumer project generation failed.' }

      - name: Build linkable static library with Ninja
        shell: powershell
        run: |
          $state = Get-Content .build/windows/host-environment.json -Raw |
            ConvertFrom-Json
          $toolDirs = $state.tools.PSObject.Properties |
            ForEach-Object { Split-Path -Parent $_.Value } |
            Select-Object -Unique
          $env:Path = ($toolDirs -join ';') + ';' + $env:Path
          $env:JH_MANAGED_BUILD_ROOT = $state.buildRoot

          $project = Join-Path $env:GITHUB_WORKSPACE 'stage5 consumer with spaces'
          $build = Join-Path $state.buildRoot 'ci-static-${{ matrix.target }}'
          if ('${{ matrix.target }}' -eq 'stm32g474') {
            $source = Join-Path $env:GITHUB_WORKSPACE 'link_libraries\stm32_lib'
          } else {
            $source = Join-Path $env:GITHUB_WORKSPACE 'link_libraries\rp_pico_lib'
          }
          $arguments = @(
            '-S', $source,
            '-B', $build,
            '-G', 'Ninja',
            "-DCMAKE_MAKE_PROGRAM=$($state.tools.ninja)",
            "-DPython3_EXECUTABLE=$($state.python)",
            "-DHAL_PROJECT_CONFIG_DIR=$project",
            '-DJH_TARGET=${{ matrix.target }}',
            '-DJH_BOARD=${{ matrix.board }}',
            '-DJH_ENABLE_ALL_FEATURES=ON',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
          )
          if ('${{ matrix.target }}' -eq 'stm32g474') {
            $arguments += "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\link_libraries\stm32_lib\toolchain_stm32g474.cmake"
          } else {
            $arguments += "-DPICO_SDK_PATH=$env:GITHUB_WORKSPACE\third_party\pico-sdk"
            $arguments += "-DJH_PICOTOOL_EXECUTABLE=$($state.tools.picotool)"
            $arguments += '-DJH_RP_PICO_BUILD_ARTIFACT_PROBE=OFF'
            $arguments += '-DJH_RP_PICO_BUILD_CORE1_PROBE=OFF'
          }
          if ('${{ matrix.target }}' -eq 'rp2350-riscv') {
            $arguments += "-DPICO_TOOLCHAIN_PATH=$(Split-Path -Parent (Split-Path -Parent $state.tools.riscv))"
          }

          & $state.tools.cmake @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Static-library configure failed.' }
          & $state.tools.cmake --build $build --target JaszczurHAL
          if ($LASTEXITCODE -ne 0) { throw 'Static-library build failed.' }
          if (-not (Test-Path "$build\libJaszczurHAL.a" -PathType Leaf)) {
            throw 'Static-library archive is missing.'
          }

      - name: Upload linkable static library
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.target }}-static-library
          path: C:\jh\build\ci-static-${{ matrix.target }}\libJaszczurHAL.a
          if-no-files-found: error
          include-hidden-files: true

  # ── Linux: stages of runalltests.sh ────────────────────────────────────────
  # Every Linux job installs the tools with scripts/install_host_tools.sh (the
  # list runmefirst.sh installs locally) and runs stages of runalltests.sh;
  # no Linux job runs checks of its own. Together the jobs run every stage
  # once except the local-only example builds (--list-local-stages), so a
  # local ./runalltests.sh (or --commit before a push) checks everything
  # Linux CI checks. tests/test_ci_gate_stages.py keeps the two in step.
  test:
    runs-on: ubuntu-24.04
    env:
      JH_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache pinned cppcheck build
        uses: actions/cache@v5
        with:
          path: |
            third_party/cppcheck
            .build/tools/cppcheck
          key: cppcheck-${{ runner.os }}-${{ hashFiles('third_party/cppcheck_version.conf', 'scripts/component_manager.py') }}

      - name: Cache pinned ESP-IDF SDK and tools
        uses: actions/cache@v5
        with:
          path: |
            third_party/esp-idf
            ~/.espressif
          key: esp-idf-${{ runner.os }}-${{ hashFiles('third_party/esp_idf_version.conf', 'security/esp_idf_tools.json') }}

      - name: Install host tools and pinned components
        run: ./scripts/install_host_tools.sh

      - name: Run gate stages
        run: ./runalltests.sh --stage tools,repository,host,esp-idf

      - name: Upload effective feature resolution
        if: ${{ always() && hashFiles('.build/gate/effective-feature-resolution.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: effective-feature-resolution
          path: .build/gate/effective-feature-resolution.json
          if-no-files-found: error

      - name: Upload ESP32-S3 Phase 3 build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32s3-phase3
          path: |
            .build/gate/esp-idf/esp32s3-phase3/jh_esp_idf_artifacts.json
            .build/gate/esp-idf/esp32s3-phase3/build.log
            .build/gate/esp-idf/esp32s3-phase3/bootloader/bootloader.bin
            .build/gate/esp-idf/esp32s3-phase3/partition_table/partition-table.bin
            .build/gate/esp-idf/esp32s3-phase3/ota_data_initial.bin
            .build/gate/esp-idf/esp32s3-phase3/esp32s3_phase3.bin
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload ESP32-S3 Phase 3 failure diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
          hashFiles('.build/gate/esp-idf/esp32s3-phase3/jh_esp_idf_failure.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32s3-phase3-failure
          path: |
            .build/gate/esp-idf/esp32s3-phase3/jh_esp_idf_failure.txt
            .build/gate/esp-idf/esp32s3-phase3/build.log
            .build/gate/esp-idf/esp32s3-phase3/generated/jaszczurhal/
            .build/gate/esp-idf/esp32s3-phase3/CMakeCache.txt
            .build/gate/esp-idf/esp32s3-phase3/CMakeFiles/CMakeConfigureLog.yaml
            .build/gate/esp-idf/esp32s3-phase3/project_description.json
            .build/gate/esp-idf/esp32s3-phase3/compile_commands.json
            .build/gate/esp-idf/esp32s3-phase3/flasher_args.json
            .build/gate/esp-idf/esp32s3-phase3/sdkconfig
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload ESP32 Classic gamepad build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32-gamepad
          path: |
            .build/gate/esp-idf/esp32-gamepad/jh_esp_idf_artifacts.json
            .build/gate/esp-idf/esp32-gamepad/build.log
            .build/gate/esp-idf/esp32-gamepad/bootloader/bootloader.bin
            .build/gate/esp-idf/esp32-gamepad/partition_table/partition-table.bin
            .build/gate/esp-idf/esp32-gamepad/esp32_gamepad.bin
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload ESP32 Classic gamepad failure diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
          hashFiles('.build/gate/esp-idf/esp32-gamepad/jh_esp_idf_failure.txt') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-esp32-gamepad-failure
          path: |
            .build/gate/esp-idf/esp32-gamepad/jh_esp_idf_failure.txt
            .build/gate/esp-idf/esp32-gamepad/build.log
            .build/gate/esp-idf/esp32-gamepad/generated/jaszczurhal/
            .build/gate/esp-idf/esp32-gamepad/CMakeCache.txt
            .build/gate/esp-idf/esp32-gamepad/CMakeFiles/CMakeConfigureLog.yaml
            .build/gate/esp-idf/esp32-gamepad/project_description.json
            .build/gate/esp-idf/esp32-gamepad/compile_commands.json
            .build/gate/esp-idf/esp32-gamepad/flasher_args.json
            .build/gate/esp-idf/esp32-gamepad/sdkconfig
          if-no-files-found: warn
          include-hidden-files: true

  stages:
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        stages:
          - sanitizer-fuzz
          - memcheck
          - cppcheck,clang-tidy,cpd
          - stm32,rp
          - library-rp2040
          - library-rp2350-arm
          - library-rp2350-riscv
          - library-stm32g474
          - security
    name: "Gate stages (${{ matrix.stages }})"

    steps:
      - uses: actions/checkout@v6

      - name: Cache pinned cppcheck build
        uses: actions/cache@v5
        with:
          path: |
            third_party/cppcheck
            .build/tools/cppcheck
          key: cppcheck-${{ runner.os }}-${{ hashFiles('third_party/cppcheck_version.conf', 'scripts/component_manager.py') }}

      # The NVD mirror is not always reachable. A daily cache keeps the full
      # download to one per day, and restore-keys hand the scan the last good
      # database when the mirror is down.
      - name: Select the CVE database cache day
        if: ${{ matrix.stages == 'security' }}
        id: cve-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache cve-bin-tool database
        if: ${{ matrix.stages == 'security' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/cve-bin-tool
          key: cve-bin-tool-${{ runner.os }}-${{ steps.cve-day.outputs.day }}
          restore-keys: |
            cve-bin-tool-${{ runner.os }}-

      - name: Install host tools and pinned components
        run: ./scripts/install_host_tools.sh

      - name: Run gate stages
        run: ./runalltests.sh --stage "${{ matrix.stages }}"
