name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Valgrind memcheck gate ─────────────────────────────────────────────────
  # Runs the host unit-test suite under Valgrind to catch memory defects
  # (leaks, use-after-free, invalid/uninitialised reads). Host-only: this does
  # NOT exercise firmware on MCU targets - it validates the portable HAL logic
  # tested in tests/. Memcheck flags and the suppressions file are configured in
  # the root CMakeLists.txt (MEMORYCHECK_* -> DartConfiguration.tcl), so a real
  # defect exits non-zero and fails this job.
  memcheck:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under Valgrind
        run: ctest --test-dir build -T memcheck --output-on-failure

  # ── Static analysis gate ───────────────────────────────────────────────────
  # Two complementary analyzers on the project's OWN code (vendored libraries
  # excluded). They reach layers the host valgrind gate cannot run:
  #
  #   cppcheck    - parses standalone, so it scans ALL own code: portable logic,
  #                 the mock/arduino/stm32 backends. This is the only gate that
  #                 covers the Arduino backend adapters (never host-executable).
  #   clang-tidy  - needs a compile database, so it covers the host-compilable
  #                 production code: portable HAL (src/hal/hal_*.cpp), shared/,
  #                 and the stm32g474 backend. The mock backend (test scaffolding)
  #                 is intentionally out of scope.
  #
  # Tool configs live in .clang-tidy and tests/cppcheck-suppressions.txt. Pinned
  # to the analyzers shipped on ubuntu-latest (clang-tidy 18, cppcheck 2.13) so
  # CI and local runs agree. Vendored code excluded: arduino drivers/frameworks,
  # cJSON, Unity.
  static-analysis:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Install analyzers
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck clang-tools

      - name: Generate compile databases
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S stm32_lib -B build_stm32 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: "cppcheck (all own code; vendored excluded)"
        run: |
          cppcheck --enable=warning,performance,portability \
            --inline-suppr \
            --suppressions-list=tests/cppcheck-suppressions.txt \
            -i src/hal/impl/arduino/drivers \
            -i src/hal/impl/arduino/frameworks \
            -i src/utils/cJSON.c -i src/utils/cJSON_Utils.c -i src/utils/unity.c \
            --error-exitcode=1 --quiet \
            src

      - name: "clang-tidy (portable HAL + shared + stm32 backend)"
        run: |
          run-clang-tidy -p build -quiet \
            '^.*/src/(hal/hal_[^/]*|hal/impl/shared/.*|utils/(?!cJSON|unity)[^/]*)\.(cpp|c)$' \
            | tee tidy_host.log
          run-clang-tidy -p build_stm32 -quiet \
            '^.*/src/hal/impl/stm32g474/.*\.(cpp|c)$' \
            | tee tidy_stm32.log
          if grep -qE ' (warning|error):' tidy_host.log tidy_stm32.log; then
            echo "::error::clang-tidy reported findings (see logs above)"
            exit 1
          fi

  # ── STM32 skeleton compile gate ────────────────────────────────────────────
  # This job builds the STM32G474 static-library target with the host compiler
  # (no Arduino core). It catches backend regressions in src/hal/impl/stm32g474
  # and contributes directly to CI quality scoring.
  stm32-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - name: Configure STM32 host build
        run: cmake -S stm32_lib -B build_stm32_host

      - name: Build STM32 host static library
        run: cmake --build build_stm32_host --parallel

  # ── Flag-propagation regression matrix ─────────────────────────────────────
  # JaszczurHAL uses an opt-in HAL_ENABLE_* model with automatic upstream
  # dependency propagation (e.g. HAL_ENABLE_PCF8563 implies HAL_ENABLE_RTC
  # and HAL_ENABLE_I2C). The three matrix profiles below exercise the
  # extreme corners of the flag space so any regression in
  # src/hal/hal_config.h (broken propagation, missing #ifdef guard in a
  # backend TU, stale consistency #error) shows up as a failed Arduino
  # static-library build.
  #
  #   empty-core   - no HAL_ENABLE_* flags at all. Validates that the
  #                  bare-core library still compiles when every optional
  #                  module is off (catches missing #ifdef guards in
  #                  arduino backend TUs).
  #   typical-set  - a realistic subset chosen so that *every*
  #                  propagation chain in hal_config.h fires at least
  #                  once (KV->EEPROM, MQTT->WIFI, PCF8563->RTC+I2C,
  #                  GPS->SWSERIAL, MCP9600->THERMOCOUPLE+I2C,
  #                  DS18B20->ONEWIRE, ILI9341->TFT->DISPLAY).
  #   all-enabled  - every HAL_ENABLE_* flag set explicitly. Validates
  #                  that no two backends collide and that all
  #                  consistency #error checks stay satisfied.
  arduino-flag-matrix:
    runs-on: ubuntu-latest
    needs: [test, stm32-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: empty-core
            flags: ""
          - profile: typical-set
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_MQTT
              -D HAL_ENABLE_KV
              -D HAL_ENABLE_PCF8563
              -D HAL_ENABLE_MCP9600
              -D HAL_ENABLE_DS18B20
              -D HAL_ENABLE_GPS
              -D HAL_ENABLE_ILI9341
              -D HAL_ENABLE_PWM_FREQ
          - profile: all-enabled
            flags: >-
              -D HAL_ENABLE_WIFI
              -D HAL_ENABLE_TIME
              -D HAL_ENABLE_MQTT
              -D HAL_ENABLE_UDP
              -D HAL_ENABLE_OTA
              -D HAL_ENABLE_WIREGUARD
              -D HAL_ENABLE_EEPROM
              -D HAL_ENABLE_KV
              -D HAL_ENABLE_LITTLEFS
              -D HAL_ENABLE_UART
              -D HAL_ENABLE_SWSERIAL
              -D HAL_ENABLE_I2C
              -D HAL_ENABLE_I2C_SLAVE
              -D HAL_ENABLE_CAN
              -D HAL_ENABLE_PCF8563
              -D HAL_ENABLE_DS3231
              -D HAL_ENABLE_MCP9600
              -D HAL_ENABLE_MAX6675
              -D HAL_ENABLE_DS18B20
              -D HAL_ENABLE_ONEWIRE
              -D HAL_ENABLE_EXTERNAL_ADC
              -D HAL_ENABLE_GPS
              -D HAL_ENABLE_DAC
              -D HAL_ENABLE_PCNT
              -D HAL_ENABLE_PWM_FREQ
              -D HAL_ENABLE_RGB_LED
              -D HAL_ENABLE_ILI9341
              -D HAL_ENABLE_SSD1306
              -D HAL_ENABLE_CRYPTO
              -D HAL_ENABLE_CJSON

    name: "Arduino lib (${{ matrix.profile }})"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino RP2040 core
        run: |
          source arduino_core_version.conf
          arduino-cli core update-index \
            --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install "rp2040:rp2040@${RP2040_CORE_VERSION}" \
            --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: "Quality Gate: Build Arduino static library (${{ matrix.profile }})"
        run: |
          ./scripts/build_arduino_lib.sh --clean ${{ matrix.flags }}
          test -f build_arduino/libJaszczurHAL.a

  # ── Examples build gate ────────────────────────────────────────────────────
  # Compile all examples through examples/CMakeLists.txt. That file is the
  # source of truth for app.c/app.cpp examples and their supported targets.
  arduino-examples:
    runs-on: ubuntu-latest
    needs: arduino-flag-matrix
    name: "Examples (RP2040 + STM32G474)"

    steps:
      - uses: actions/checkout@v5

      - name: Install STM32 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino RP2040 core
        run: |
          source arduino_core_version.conf
          arduino-cli core update-index \
            --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core install "rp2040:rp2040@${RP2040_CORE_VERSION}" \
            --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

      - name: Compile RP2040 examples
        run: |
          cmake -S examples -B build_examples_rp2040 \
            -DJH_EXAMPLE_TARGET=rp2040
          cmake --build build_examples_rp2040 --parallel 4

      - name: Compile STM32G474 examples
        run: |
          cmake -S examples -B build_examples_stm32g474 \
            -DJH_EXAMPLE_TARGET=stm32g474 \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/stm32_lib/toolchain_stm32g474.cmake"
          cmake --build build_examples_stm32g474 --parallel 4
